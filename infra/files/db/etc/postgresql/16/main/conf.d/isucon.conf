listen_addresses = '*'

# 計測用（scripts/bench-monitor.sh が開始時にリセットし、停止時に集計を取る）
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 5000
track_io_timing = on
# 100ms 以上かかったクエリと、1秒以上のロック待ちをログに出す
log_min_duration_statement = 100
log_lock_waits = on

# メモリ 3.8GB のうち 1GB を共有バッファにする（初期値 128MB。画像の取得でディスクからの読み込みが多い）
shared_buffers = 1GB
effective_cache_size = 3GB
