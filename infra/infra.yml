# ミドルウェアの設定ファイルを配る。変わったファイルに対応するサービスだけ reload / restart する
# 差分の確認: make infra-diff（--check --diff。サーバーは変更しない）
- hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: managed_files must not touch files used by the organizers
      ansible.builtin.assert:
        that: forbidden_paths | select('in', item.path) | list | length == 0
        fail_msg: "{{ item.path }} is forbidden by the manual"
        quiet: true
      loop: "{{ managed_files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: deploy managed files
      ansible.builtin.copy:
        src: "{{ lookup('ansible.builtin.first_found', ['files/' ~ inventory_hostname ~ item.path, 'files/' ~ group_names[0] ~ item.path]) }}"
        dest: "{{ item.path }}"
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop: "{{ managed_files }}"
      loop_control:
        label: "{{ item.path }}"
      register: deployed

    # loop の notify はテンプレートを最後の item で評価してしまうので、変わったファイルから自分で決める
    - name: decide what to reload or restart
      ansible.builtin.set_fact:
        actions: "{{ deployed.results | selectattr('changed') | map(attribute='item.notify') | unique | list }}"

    - name: show actions
      ansible.builtin.debug:
        var: actions

    - name: validate nginx config
      when: "'reload nginx' in actions"
      ansible.builtin.command: nginx -t
      changed_when: false
      check_mode: false

    - name: reload nginx
      when: "'reload nginx' in actions"
      ansible.builtin.systemd_service:
        name: nginx
        state: reloaded

    - name: restart isureal-go
      when: "'restart isureal-go' in actions"
      ansible.builtin.systemd_service:
        name: isureal-go
        state: restarted
        daemon_reload: true

    - name: restart postgresql
      when: "'restart postgresql' in actions"
      ansible.builtin.systemd_service:
        name: postgresql@16-main
        state: restarted

    # reset.sql は拡張に触らないので、一度作れば初期化後も残る
    - name: enable pg_stat_statements
      when: "'db' in group_names"
      become_user: postgres
      ansible.builtin.command: psql -d isureal -Atc "CREATE EXTENSION IF NOT EXISTS pg_stat_statements"
      register: pgss
      changed_when: "'already exists' not in pgss.stderr"

- hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: envcheck
      ansible.builtin.command: /usr/local/bin/envcheck
      changed_when: false
      when: not ansible_check_mode
